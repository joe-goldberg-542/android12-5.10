name: build-kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Templar-6"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
          - neutron clang 24
        default: "neutron clang 24"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_LRU_GEN_STATS=n,CONFIG_LRU_GEN_ENABLED=y,CONFIG_LRU_GEN=y,CONFIG_KALLSYMS=y,CONFIG_SCHED_BORE=n,CONFIG_KALLSYMS_ALL=y,CONFIG_KSU=y,CONFIG_KSU_TOOLKIT_SUPPORT=y,CONFIG_KSU_INLINE_HOOK=y,CONFIG_KSU_DISABLE_SELINUX_VFS_GETXATTR=y,CONFIG_KSU_DEBUG=n,CONFIG_KSU_SUCOMPAT=n,CONFIG_OVERLAY_FS=y,CONFIG_KPROBES=y,CONFIG_HAVE_KPROBES=y,CONFIG_KPROBE_EVENTS=y,CONFIG_NOMOUNT=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst","neutron clang 24":"neutron-clang-24"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio curl zstd lz4
          pip install lxml

      - name: Configure Git Safe Directory & Identity
        run: |
          git config --global --add safe.directory "*"
          git config --global user.email "joe_goldberg_542@protonmail.com"
          git config --global user.name "joe-goldberg-542"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
          fail-on-cache-miss: false

      - name: Add 15G swap (Fix for Full LTO OOM)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 15G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=15360
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel Source
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi

      - name: Revert 6.12 Version Spoofing (Restore Original 5.10.271)
        run: |
          cd work/common
          echo "=== Reverting 6.12.25 Spoofing Commit ==="

          if git revert --no-edit 9be64aa501c6ac85a21b9860875cf1c6aa9cd6d2; then
            echo "✅ Cleanly reverted commit 9be64aa501c6ac85a21b9860875cf1c6aa9cd6d2"
          else
            echo "⚠️ Direct git revert had conflicts; restoring 5.10.271 files from parent commit..."
            git revert --abort || true
            git checkout 9be64aa501c6ac85a21b9860875cf1c6aa9cd6d2~1 -- \
              Makefile \
              kernel/module.c \
              kernel/sys.c \
              kernel/utsname_sysctl.c
            git commit -m "Revert 6.12.25 version spoofing back to 5.10.271"
          fi

          # Safety check: ensure Makefile is strictly 5.10.271
          sed -i 's/^VERSION = .*/VERSION = 5/' Makefile
          sed -i 's/^PATCHLEVEL = .*/PATCHLEVEL = 10/' Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 271/' Makefile

          head -n 5 Makefile

      - name: Purge le9uo commits
        run: |
          cd work/common
          echo "=== 1. Dynamically Finding and Reverting all le9uo commits ==="
          
          # Find commits containing "le9uo" in the commit message (newest first)
          LE9UO_COMMITS=$(git log --grep="le9uo" -i --format="%H")
          
          if [ -n "$LE9UO_COMMITS" ]; then
            echo "Found le9uo commits:"
            echo "$LE9UO_COMMITS"
            
            for commit in $LE9UO_COMMITS; do
              echo "-> Reverting: $commit"
              
              # Try to revert without committing immediately
              if ! git revert --no-commit "$commit"; then
                echo "⚠️ Conflict detected on $commit, checking conflicted files..."
                
                # Auto-resolve defconfig conflicts by keeping HEAD version
                for conf in arch/arm64/configs/gki_defconfig arch/arm64/configs/*defconfig; do
                  if [ -f "$conf" ]; then
                    git checkout HEAD -- "$conf" 2>/dev/null || true
                    git add "$conf" 2>/dev/null || true
                  fi
                done

                # Check if there are still unresolved files
                if git diff --name-only --diff-filter=U | grep -q .; then
                  echo "⚠️ Unresolvable code conflict on $commit! Aborting this specific revert..."
                  git revert --abort
                else
                  echo "✅ Defconfig conflict auto-resolved for $commit"
                fi
              fi
            done
            
            # Final step: Commit all the staged reverted changes
            if ! git diff --cached --quiet; then
              git commit -m "chore: Revert le9uo commits"
              echo "✅ All clean reverts successfully committed!"
            else
              echo "ℹ️ No changes left to commit after reverting."
            fi
            
          else
            echo "ℹ️ No le9uo commits found. Skipping."
          fi

      - name: Apply Custom Patches
        run: |
          cd work/common
          echo "=== Applying Custom Patches ==="

          PATCH_DIRS=(
            "$GITHUB_WORKSPACE/.github/workflows/patches"
            "$GITHUB_WORKSPACE/patches"
          )

          shopt -s nullglob
          APPLIED_COUNT=0

          for dir in "${PATCH_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "--> Checking patches in: $dir"
              for patch_file in "$dir"/*.patch; do
                echo "=========================================="
                echo "--> Applying patch: $(basename "$patch_file")"
                if git apply --check "$patch_file" 2>/dev/null; then
                  git apply "$patch_file"
                  echo "✅ Applied cleanly with git apply: $(basename "$patch_file")"
                elif git apply --3way "$patch_file" 2>/dev/null; then
                  echo "✅ Applied with 3-way merge: $(basename "$patch_file")"
                elif patch -p1 --forward --fuzz=3 < "$patch_file"; then
                  echo "✅ Applied with patch -p1 (fuzz=3): $(basename "$patch_file")"
                else
                  echo "::error:: ❌ Failed to apply patch: $(basename "$patch_file")"
                  exit 1
                fi
                APPLIED_COUNT=$((APPLIED_COUNT + 1))
              done
            fi
          done

          if [ "$APPLIED_COUNT" -eq 0 ]; then
            echo "ℹ️ No .patch files found to apply."
          else
            git add -A
            git commit -m "chore: Apply $APPLIED_COUNT custom patch(es)" || true
            echo "✅ Successfully applied and committed $APPLIED_COUNT patch(es)!"
          fi

      - name: Clean Hardcoded NoMount & Integrate Official NoMount (Method 3 - Dev Branch)
        run: |
          cd work/common

          echo "=== 1. Completely Purging All Old NoMount ==="
          rm -rf fs/nomount fs/nomount.c fs/nomount.h
          sed -i '/nomount/d' fs/Kconfig
          sed -i '/nomount/d' fs/Makefile

          sed -i '/nomount/d' fs/d_path.c 2>/dev/null || true
          sed -i '/nomount/d' fs/namei.c 2>/dev/null || true
          sed -i '/nomount/d' fs/stat.c 2>/dev/null || true
          sed -i '/nomount/d' fs/statfs.c 2>/dev/null || true
          sed -i '/nomount/d' fs/readdir.c 2>/dev/null || true
          sed -i '/nomount/d' fs/proc/task_mmu.c 2>/dev/null || true

          echo "=== 2. Integrating Official NoMount via Method 3 (dev branch) ==="
          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git ../nomount

          sed -i '$i source "fs/nomount/Kconfig"' fs/Kconfig
          echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile

          mkdir -p fs/nomount
          if [ -d "../nomount/kernel/src" ]; then
            cp -rf ../nomount/kernel/src/* fs/nomount/
          elif [ -d "../nomount/src" ]; then
            cp -rf ../nomount/src/* fs/nomount/
          fi
          
          echo "✅ Old NoMount wiped and Official Method 3 (dev branch) applied!"

      - name: Apply SUSFS
        run: |
          cd work/common

          echo "=== Integrating SUSFS into Kernel ==="
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || echo "Warning: SUSFS patch issue"

      - name: Setting up ReSukiSU (Smart SuSFS-Compatible Latest Branch + Auto-Merge)
        run: |
          cd work/common
          echo "=== 1. Detecting latest SuSFS-compatible Baka-SU branch ==="

          git clone --bare --filter=blob:none https://github.com/Baka-SU/BakaSU.git bakasu_temp
          cd bakasu_temp

          ALL_RECENT_BRANCHES=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/heads/ | grep -v -E '^weblate')
          SELECTED_BRANCH=""

          for branch in $ALL_RECENT_BRANCHES; do
            if git show "refs/heads/$branch:kernel/tools/susfs_compat.mk" 2>/dev/null | grep -q "Please wait susfs update"; then
              echo "⏭️ Skipping '$branch' as primary base (SuSFS blocker present in this branch)"
              continue
            fi
            SELECTED_BRANCH="$branch"
            break
          done

          if [ -z "$SELECTED_BRANCH" ]; then
            SELECTED_BRANCH="sync-susfs"
          fi

          LATEST_BAKASU_BRANCH="$SELECTED_BRANCH"
          LATEST_BAKASU_COMMIT=$(git rev-parse "refs/heads/$LATEST_BAKASU_BRANCH")
          COMMIT_DESC=$(git log -1 --pretty=format:"%s (%cr)" "$LATEST_BAKASU_COMMIT")

          echo "🎯 Selected Primary SuSFS-Ready Branch: $LATEST_BAKASU_BRANCH"
          echo "📌 Commit SHA: $LATEST_BAKASU_COMMIT"
          echo "📝 Last Update: $COMMIT_DESC"

          cd ..
          rm -rf bakasu_temp

          echo "=== 2. Running setup.sh for branch: $LATEST_BAKASU_BRANCH ==="
          SETUP_URL="https://raw.githubusercontent.com/Baka-SU/BakaSU/${LATEST_BAKASU_BRANCH}/kernel/setup.sh"
          if ! curl --head --silent --fail "$SETUP_URL" > /dev/null; then
             echo "⚠️ setup.sh not directly reachable on $LATEST_BAKASU_BRANCH, using main setup.sh..."
             SETUP_URL="https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh"
          fi
          curl -LSs "$SETUP_URL" | bash -s "${LATEST_BAKASU_BRANCH}"

          cd KernelSU
          git fetch origin
          git checkout "$LATEST_BAKASU_BRANCH" || git checkout -b "$LATEST_BAKASU_BRANCH" "origin/$LATEST_BAKASU_BRANCH"
          git reset --hard "$LATEST_BAKASU_COMMIT"

          # Newer unmerged branches (jaise luyanci-patch-1 ya main) ko safely merge karna
          for branch in $ALL_RECENT_BRANCHES; do
            if [ "$branch" = "$LATEST_BAKASU_BRANCH" ]; then
              break
            fi
            echo "🔄 Trying to merge newer unmerged branch 'origin/$branch' into '$LATEST_BAKASU_BRANCH'..."
            if git merge --no-commit --no-ff "origin/$branch" 2>/dev/null; then
              git checkout "$LATEST_BAKASU_COMMIT" -- kernel/tools/susfs_compat.mk 2>/dev/null || true
              git commit -m "Merge branch '$branch' into $LATEST_BAKASU_BRANCH" || true
              echo "✅ Merged '$branch' cleanly!"
            else
              echo "⚠️ Merge conflict with '$branch', skipping auto-merge for this branch."
              git merge --abort 2>/dev/null || true
            fi
          done

          FINAL_COMMIT=$(git rev-parse HEAD)
          cd ..

          echo "DETECTED_BAKASU_BRANCH=$LATEST_BAKASU_BRANCH" >> $GITHUB_ENV
          echo "DETECTED_BAKASU_COMMIT=$FINAL_COMMIT" >> $GITHUB_ENV
          
          echo "=== 3. Adding Defconfig Options (SuSFS v2.3.0 + Experimental) ==="
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          # Master Switch
          CONFIG_KSU=y
          CONFIG_KSU_SENTINEL=y
          CONFIG_KSU_SUSFS=y

          # Core Stealth & Spoofing (Standard v2.3.0)
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

          # Experimental Features
          CONFIG_KSU_SUSFS_SUS_MEMFD=y
          CONFIG_KSU_SUSFS_SUS_PROC_FD_LINK=y
          EOF

          echo "✅ BakaSU ($LATEST_BAKASU_BRANCH @ $FINAL_COMMIT) applied successfully!"

      - name: Absolute Stealth (Dynamic UTS_RELEASE Injection)
        run: |
          cd work/common
          
          echo "=== Absolute Stealth: Dynamic UTS_RELEASE Injection ==="
          
          K_VER=$(grep '^VERSION = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_PATCH=$(grep '^PATCHLEVEL = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_SUB=$(grep '^SUBLEVEL = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_EXTRA=$(grep '^EXTRAVERSION = ' Makefile | tr -d ' ' | cut -d= -f2)
          
          LOCAL_VER="-android12-9"
          
          CURRENT_BUILD_VERSION="${K_VER}.${K_PATCH}.${K_SUB}${K_EXTRA}${LOCAL_VER}"
          echo "--> Dynamically detected clean version: $CURRENT_BUILD_VERSION"
          
          sed -i "s/\.release.*=.*UTS_RELEASE,/.release\t= \"$CURRENT_BUILD_VERSION\",/g" init/version.c
          
          echo "#!/bin/sh" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          
          echo "✅ C Code strictly locked to dynamically detected version: $CURRENT_BUILD_VERSION !"

      - name: Setup Neutron Clang 24
        if: ${{ inputs.clang_version == 'neutron clang 24' }}
        run: |
          echo "=== Syncing Neutron Clang ==="
          mkdir -p $GITHUB_WORKSPACE/neutron-clang
          cd $GITHUB_WORKSPACE/neutron-clang
          
          curl -sO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          
          ./antman -S
          ./antman --patch=glibc
          
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH
          echo "CC=ccache clang" >> $GITHUB_ENV
          echo "CXX=ccache clang++" >> $GITHUB_ENV
          echo "LTO=full" >> $GITHUB_ENV
          
      - name: Build kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Fail-Safe Repack with Stock boot.img Parameters & Secure AVB Signature 🔒
        env:
          BOOT_IMG_URL: "https://www.dropbox.com/scl/fi/16oax1feqzx2z9spqkudy/Shinkaiboot.img?rlkey=3fuh9bgja0djrsmutg2rvqo6a&st=cw6rafsz&dl=1"
        shell: bash
        run: |
          echo "=== 1. Download official STABLE gki toolchain modules ==="
          mkdir -p repack/extracted
          mkdir -p repack/output
          
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg repack/mkbootimg_tool
          git clone --depth=1 https://android.googlesource.com/platform/external/avb repack/avb_tool

          echo "--> Pulling ROM stock file dynamically..."
          curl -L "$BOOT_IMG_URL" -o repack/stock_boot.img

          PARTITION_SIZE=$(stat -c %s "repack/stock_boot.img")
          if [ "$PARTITION_SIZE" -lt 15000000 ]; then
             echo "::error:: Corrupt boot image downloaded."
             exit 1
          fi

          export IMAGE_PATH="$GITHUB_WORKSPACE/work/dist/Image"
          if [ ! -f "$IMAGE_PATH" ]; then
             echo "::error:: Compiling GKI raw Image output does not exist!"
             exit 1
          fi

          echo "--> Executing extraction parser step on ROM target..."
          python3 repack/mkbootimg_tool/unpack_bootimg.py --boot_img repack/stock_boot.img --out repack/extracted > repack/extracted/configs.txt

          echo "=== 2. Launch Intelligent Config Python Swapper Engine ==="
          python3 - << 'EOF'
          import sys, os, subprocess

          config = {}
          with open("repack/extracted/configs.txt") as f:
              for line in f:
                  if ":" in line:
                      key, val = line.split(":", 1)
                      config[key.strip().lower().replace("_", " ")] = val.strip()

          header_version = config.get("boot image header version") or config.get("header version") or "4"
          page_size = config.get("page size") or "4096"
          cmdline = config.get("command line args") or config.get("command line") or config.get("cmdline") or ""
          board_name = config.get("name") or config.get("board name") or config.get("board") or ""
          os_version = config.get("os version") or ""
          os_patch_level = config.get("os patch level") or ""

          cmd = [
              "python3", "repack/mkbootimg_tool/mkbootimg.py",
              "--kernel", os.environ.get("IMAGE_PATH"),
              "--header_version", str(header_version),
              "--pagesize", str(page_size),
              "--output", "repack/output/boot.img"
          ]

          if cmdline: cmd.extend(["--cmdline", cmdline])
          if board_name: cmd.extend(["--board", board_name])
          if os_version and os_version != "None": cmd.extend(["--os_version", os_version])
          if os_patch_level and os_patch_level != "None": cmd.extend(["--os_patch_level", os_patch_level])

          if os.path.exists("repack/extracted/ramdisk"): cmd.extend(["--ramdisk", "repack/extracted/ramdisk"])
          if os.path.exists("repack/extracted/dtb"): cmd.extend(["--dtb", "repack/extracted/dtb"])
          if os.path.exists("repack/extracted/dtbo"): cmd.extend(["--dtbo", "repack/extracted/dtbo"])

          res = subprocess.run(cmd)
          if res.returncode != 0:
              print("::error:: mkbootimg repack failed.")
              sys.exit(1)
          EOF

          if [ ! -f "repack/output/boot.img" ]; then
             echo "::error:: Repacked boot image not found."
             exit 1
          fi

          echo "=== 3. Register AVB Signatures ==="
          python3 repack/avb_tool/avbtool.py add_hash_footer \
            --image "repack/output/boot.img" \
            --partition_name boot \
            --partition_size "$PARTITION_SIZE" \
            --key "repack/avb_tool/test/data/testkey_rsa2048.pem" \
            --algorithm SHA256_RSA2048

          cp repack/output/boot.img "$GITHUB_WORKSPACE/work/dist/boot.img"
          echo "✅ Final boot.img safely stored!"
          
      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config boot.img; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Kernel GKI $tag" \
              --notes "Built with BakaSU (${DETECTED_BAKASU_BRANCH:-main} @ ${DETECTED_BAKASU_COMMIT:0:8}), SuSFS v2.3.0. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
