name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux7-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
          - neutron clang 24
        default: "neutron clang 24"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_LRU_GEN_STATS=n,CONFIG_LRU_GEN_ENABLED=y,CONFIG_LRU_GEN=y,CONFIG_SCHED_BORE=n,CONFIG_KALLSYMS=y,# CONFIG_KALLSYMS_ALL is not set,CONFIG_KSU=y,CONFIG_KSU_MANUAL_HOOK=y,CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y,CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y,CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y,CONFIG_EXT4_FS=y,CONFIG_HEADERS_INSTALL=y,CONFIG_THREAD_INFO_IN_TASK=y,CONFIG_KSU_SUSFS=y,CONFIG_OVERLAY_FS=y,CONFIG_NOMOUNT=y"

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst","neutron clang 24":"neutron-clang-24"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev gh bc bison flex libssl-dev libelf-dev dwarves cpio curl zstd lz4 cmake zlib1g-dev zip unzip
          pip install lxml

      - name: Configure Git Identity
        run: |
          git config --global --add safe.directory "*"
          git config --global user.email "joe_goldberg_542@protonmail.com"
          git config --global user.name "joe-goldberg-542"

      - name: Allocate 15GB Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 15G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=15360
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel Source
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi

      - name: Revert le9uo Commits
        run: |
          cd work/common
          LE9UO_COMMITS=$(git log --grep="le9uo" -i --format="%H")

          if [ -n "$LE9UO_COMMITS" ]; then
            for commit in $LE9UO_COMMITS; do
              if ! git revert --no-commit "$commit"; then
                for conf in arch/arm64/configs/gki_defconfig arch/arm64/configs/*defconfig; do
                  if [ -f "$conf" ]; then
                    git checkout HEAD -- "$conf" 2>/dev/null || true
                    git add "$conf" 2>/dev/null || true
                  fi
                done

                if git diff --name-only --diff-filter=U | grep -q .; then
                  git revert --abort
                fi
              fi
            done

            if ! git diff --cached --quiet; then
              git commit -m "chore: Revert le9uo commits"
            fi
          fi

      - name: Apply Custom Patches
        run: |
          cd work/common
          PATCH_DIRS=(
            "$GITHUB_WORKSPACE/.github/workflows/patches"
            "$GITHUB_WORKSPACE/patches"
          )

          shopt -s nullglob
          APPLIED_COUNT=0

          for dir in "${PATCH_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if git apply --check "$patch_file" 2>/dev/null; then
                  git apply "$patch_file"
                elif git apply --3way "$patch_file" 2>/dev/null; then
                  :
                elif patch -p1 --forward --fuzz=3 < "$patch_file"; then
                  :
                else
                  echo "::error::Failed to apply patch: $(basename "$patch_file")"
                  exit 1
                fi
                APPLIED_COUNT=$((APPLIED_COUNT + 1))
              done
            fi
          done

          if [ "$APPLIED_COUNT" -gt 0 ]; then
            git add -A
            git commit -m "chore: Apply $APPLIED_COUNT custom patch(es)" || true
          fi

      - name: Integrate BakaSU
        run: |
          cd work/common
          rm -rf KernelSU FinaSU BakaSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true

          # Clone BakaSU (already includes KernelSU-side SuSFS support)
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

      - name: Integrate SuSFS (Kernel-side Patch for BakaSU)
        run: |
          cd work/common
          rm -rf ../susfs4ksu
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

          if [ ! -d "../susfs4ksu/kernel_patches" ]; then
             echo "::error::SuSFS kernel_patches directory missing!"
             exit 1
          fi

          # Copy kernel patch, fs/*, and include/linux/*
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./
          cp -R ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -R ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          # Patch Kernel (Note: BakaSU already has KernelSU-side SuSFS built-in, so 10_enable_susfs_for_ksu.patch is not needed)
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch
          echo "CFLAGS_susfs.o += -Wno-unused-function" >> ./fs/Makefile

          # Delete abi_gki_protected_exports files if present
          rm -f ./android/abi_gki_protected_exports_aarch64 ./android/abi_gki_protected_exports_x86_64

      - name: Apply BakaSU Manual Hooks & SELinux Static Exports (No KALLSYMS_ALL)
        run: |
          cd work/common
          python3 - << 'EOF'
          import re
          from pathlib import Path

          def patch_file(path_str, fn):
              p = Path(path_str)
              if not p.exists():
                  raise SystemExit(f"File not found: {path_str}")
              orig = p.read_text()
              updated = fn(orig)
              if orig == updated:
                  print(f"[WARN] No changes made to {path_str} (already patched or pattern mismatch)")
              else:
                  p.write_text(updated)
                  print(f"[OK] Patched {path_str}")

          # --- 1. fs/stat.c ---
          def patch_stat(s):
              if "ksu_handle_newfstat_ret" not in s:
                  extern_block = (
                      "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                      "__attribute__((hot))\n"
                      "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
                      "\t\t\t\tint *flags);\n\n"
                      "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
                      "#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n"
                      "extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n"
                      "#endif\n"
                      "#endif\n\n"
                  )
                  s = re.sub(
                      r'(SYSCALL_DEFINE4\(newfstatat,)',
                      extern_block + r'\1',
                      s, count=1
                  )
                  s = re.sub(
                      r'(\terror = vfs_fstatat\(dfd, filename, &stat, flag\);)',
                      '#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\\1',
                      s
                  )
                  s = re.sub(
                      r'(SYSCALL_DEFINE2\(newfstat,[\s\S]*?cp_new_stat\(&stat, statbuf\);\n)',
                      r'\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n',
                      s, count=1
                  )
                  s = re.sub(
                      r'(SYSCALL_DEFINE2\(fstat64,[\s\S]*?cp_new_stat64\(&stat, statbuf\);\n)',
                      r'\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\n',
                      s, count=1
                  )
              return s

          # --- 2. fs/exec.c ---
          def patch_exec(s):
              if "ksu_handle_post_execveat" not in s:
                  extern_block = (
                      "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                      "__attribute__((hot))\n"
                      "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                      "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
                      "__attribute__((hot))\n"
                      "extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr,\n"
                      "\t\t\t\tvoid *argv, void *envp, int *flags, int *retval);\n"
                      "#endif\n\n"
                  )
                  s = re.sub(
                      r'(static int do_execveat_common\(int fd, struct filename \*filename,)',
                      extern_block + r'\1',
                      s, count=1
                  )
                  s = re.sub(
                      r'(static int do_execveat_common\([\s\S]*?)(\tif \(IS_ERR\(filename\)\))',
                      r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\n\2',
                      s, count=1
                  )
                  s = re.sub(
                      r'(static int do_execveat_common\([\s\S]*?out_ret:\n)',
                      r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);\n#endif\n',
                      s, count=1
                  )
              return s

          # --- 3. fs/open.c ---
          def patch_open(s):
              if "ksu_handle_faccessat" not in s:
                  extern_block = (
                      "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                      "__attribute__((hot))\n"
                      "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                      "\t\t\t\tint *mode, int *flags);\n"
                      "#endif\n\n"
                  )
                  s = re.sub(
                      r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\n\{\n)',
                      extern_block + r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n',
                      s, count=1
                  )
              return s

          # --- 4. kernel/reboot.c ---
          def patch_reboot(s):
              if "ksu_handle_sys_reboot" not in s:
                  extern_block = (
                      "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                      "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                      "#endif\n\n"
                  )
                  s = re.sub(
                      r'(SYSCALL_DEFINE4\(reboot,)',
                      extern_block + r'\1',
                      s, count=1
                  )
                  s = re.sub(
                      r'(SYSCALL_DEFINE4\(reboot,[\s\S]*?)(\tif \(!ns_capable\(pid_ns->user_ns, CAP_SYS_BOOT\)\))',
                      r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\2',
                      s, count=1
                  )
              return s

          # --- 5. SELinux Static Symbol Exports (Required when CONFIG_KALLSYMS_ALL is disabled) ---
          def patch_selinuxfs(s):
              s = re.sub(
                  r'static\s+(ssize_t\s+\(\*write_op\[\]\)\(struct file \*, char \*, size_t\)\s*=\s*\{)',
                  r'\1', s
              )
              s = re.sub(
                  r'static\s+(const\s+struct\s+file_operations\s+sel_handle_status_ops\s*=\s*\{)',
                  r'\1', s
              )
              return s

          def patch_selinux_services(s):
              s = re.sub(
                  r'static\s+(void\s+security_dump_masked_av\s*\()',
                  r'\1', s
              )
              s = re.sub(
                  r'static\s+(void\s+context_struct_compute_av\s*\()',
                  r'\1', s
              )
              return s

          patch_file("fs/stat.c", patch_stat)
          patch_file("fs/exec.c", patch_exec)
          patch_file("fs/open.c", patch_open)
          patch_file("kernel/reboot.c", patch_reboot)
          patch_file("security/selinux/selinuxfs.c", patch_selinuxfs)
          patch_file("security/selinux/ss/services.c", patch_selinux_services)
          EOF

      - name: Integrate NoMount (Official Manual Method 3)
        run: |
          cd work/common
          rm -rf fs/nomount fs/nomount.c fs/nomount.h ../nomount
          sed -i '/nomount/d' fs/Kconfig
          sed -i '/nomount/d' fs/Makefile

          sed -i '/nomount/d' fs/d_path.c 2>/dev/null || true
          sed -i '/nomount/d' fs/namei.c 2>/dev/null || true
          sed -i '/nomount/d' fs/stat.c 2>/dev/null || true
          sed -i '/nomount/d' fs/statfs.c 2>/dev/null || true
          sed -i '/nomount/d' fs/readdir.c 2>/dev/null || true
          sed -i '/nomount/d' fs/proc/task_mmu.c 2>/dev/null || true

          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git ../nomount

          # 1. Add to fs/Kconfig before the final endmenu
          awk '
              /^endmenu/ { last_match = NR }
              { lines[NR] = $0 }
              END {
                  for (i = 1; i <= NR; i++) {
                      if (i == last_match) print "source \"fs/nomount/Kconfig\""
                      print lines[i]
                  }
              }
          ' fs/Kconfig > fs/Kconfig.tmp && mv fs/Kconfig.tmp fs/Kconfig

          # 2. Add to fs/Makefile
          echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile

          # 3. Copy the necessary files
          mkdir -p fs/nomount
          cp -f ../nomount/kernel/src/* fs/nomount/

      - name: Configure Defconfig for BakaSU, SuSFS, and NoMount (Without KALLSYMS_ALL)
        run: |
          # Ensure CONFIG_KALLSYMS_ALL is removed from any builder fragments
          find "$GITHUB_WORKSPACE/build/fragments" -type f -name "*.config" -exec sed -i '/CONFIG_KALLSYMS_ALL/d' {} + 2>/dev/null || true

          cd work/common
          sed -i '/CONFIG_KALLSYMS_ALL/d' arch/arm64/configs/gki_defconfig

          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONFIG_KALLSYMS=y
          # CONFIG_KALLSYMS_ALL is not set
          CONFIG_EXT4_FS=y
          CONFIG_HEADERS_INSTALL=y
          CONFIG_OVERLAY_FS=y
          CONFIG_THREAD_INFO_IN_TASK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_NOMOUNT=y
          EOF

          git add -A
          git commit -m "chore: Integrate BakaSU (Manual Hooks), SuSFS, and NoMount" || true

      - name: Lock UTS_RELEASE Version
        run: |
          cd work/common
          K_VER=$(grep '^VERSION = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_PATCH=$(grep '^PATCHLEVEL = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_SUB=$(grep '^SUBLEVEL = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_EXTRA=$(grep '^EXTRAVERSION = ' Makefile | tr -d ' ' | cut -d= -f2)

          LOCAL_VER="-android12-9"
          CURRENT_BUILD_VERSION="${K_VER}.${K_PATCH}.${K_SUB}${K_EXTRA}${LOCAL_VER}"

          sed -i "s/\.release.*=.*UTS_RELEASE,/.release\t= \"$CURRENT_BUILD_VERSION\",/g" init/version.c

          echo "#!/bin/sh" > scripts/setlocalversion
          chmod +x scripts/setlocalversion

      - name: Setup Neutron Clang
        if: ${{ inputs.clang_version == 'neutron clang 24' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/neutron-clang
          cd $GITHUB_WORKSPACE/neutron-clang

          curl -sO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman

          ./antman -S
          ./antman --patch=glibc

          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "LTO=full" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh

      - name: Repack and Sign Boot Image
        env:
          BOOT_IMG_URL: "https://www.dropbox.com/scl/fi/16oax1feqzx2z9spqkudy/Shinkaiboot.img?rlkey=3fuh9bgja0djrsmutg2rvqo6a&st=cw6rafsz&dl=1"
        shell: bash
        run: |
          mkdir -p repack/extracted
          mkdir -p repack/output

          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg repack/mkbootimg_tool
          git clone --depth=1 https://android.googlesource.com/platform/external/avb repack/avb_tool

          curl -L "$BOOT_IMG_URL" -o repack/stock_boot.img

          PARTITION_SIZE=$(stat -c %s "repack/stock_boot.img")
          if [ "$PARTITION_SIZE" -lt 15000000 ]; then
             echo "::error::Corrupt boot image downloaded."
             exit 1
          fi

          export IMAGE_PATH="$GITHUB_WORKSPACE/work/dist/Image"
          if [ ! -f "$IMAGE_PATH" ]; then
             echo "::error::Compiled kernel Image does not exist."
             exit 1
          fi

          python3 repack/mkbootimg_tool/unpack_bootimg.py --boot_img repack/stock_boot.img --out repack/extracted > repack/extracted/configs.txt

          python3 - << 'EOF'
          import sys, os, subprocess

          config = {}
          with open("repack/extracted/configs.txt") as f:
              for line in f:
                  if ":" in line:
                      key, val = line.split(":", 1)
                      config[key.strip().lower().replace("_", " ")] = val.strip()

          header_version = config.get("boot image header version") or config.get("header version") or "4"
          page_size = config.get("page size") or "4096"
          cmdline = config.get("command line args") or config.get("command line") or config.get("cmdline") or ""
          board_name = config.get("name") or config.get("board name") or config.get("board") or ""
          os_version = config.get("os version") or ""
          os_patch_level = config.get("os patch level") or ""

          cmd = [
              "python3", "repack/mkbootimg_tool/mkbootimg.py",
              "--kernel", os.environ.get("IMAGE_PATH"),
              "--header_version", str(header_version),
              "--pagesize", str(page_size),
              "--output", "repack/output/boot.img"
          ]

          if cmdline: cmd.extend(["--cmdline", cmdline])
          if board_name: cmd.extend(["--board", board_name])
          if os_version and os_version != "None": cmd.extend(["--os_version", os_version])
          if os_patch_level and os_patch_level != "None": cmd.extend(["--os_patch_level", os_patch_level])

          if os.path.exists("repack/extracted/ramdisk"): cmd.extend(["--ramdisk", "repack/extracted/ramdisk"])
          if os.path.exists("repack/extracted/dtb"): cmd.extend(["--dtb", "repack/extracted/dtb"])
          if os.path.exists("repack/extracted/dtbo"): cmd.extend(["--dtbo", "repack/extracted/dtbo"])

          res = subprocess.run(cmd)
          if res.returncode != 0:
              print("::error::mkbootimg repack failed.")
              sys.exit(1)
          EOF

          if [ ! -f "repack/output/boot.img" ]; then
             echo "::error::Repacked boot image not found."
             exit 1
          fi

          python3 repack/avb_tool/avbtool.py add_hash_footer \
            --image "repack/output/boot.img" \
            --partition_name boot \
            --partition_size "$PARTITION_SIZE" \
            --key "repack/avb_tool/test/data/testkey_rsa2048.pem" \
            --algorithm SHA256_RSA2048

          cp repack/output/boot.img "$GITHUB_WORKSPACE/work/dist/boot.img"

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-kernel-${{ github.run_number }}
          path: |
            work/dist/Image
            work/dist/Image.lz4
            work/dist/Image.gz
            work/dist/vmlinux
            work/dist/System.map
            work/dist/ikconfig
            work/dist/.config
            work/dist/boot.img
          retention-days: 7

      - name: Publish Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi

          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config boot.img; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Kernel GKI $tag" \
              --notes "Built with BakaSU (Manual Hooks) + SuSFS + NoMount. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
