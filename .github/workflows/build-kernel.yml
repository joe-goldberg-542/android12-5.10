name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux2-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
          - neutron clang 24
        default: "neutron clang 24"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_LRU_GEN_STATS=n,CONFIG_LRU_GEN_ENABLED=y,CONFIG_LRU_GEN=y,CONFIG_KALLSYMS=y,CONFIG_SCHED_BORE=n,CONFIG_KALLSYMS_ALL=y,CONFIG_KSU=y,CONFIG_KSU_TOOLKIT_SUPPORT=y,CONFIG_KSU_INLINE_HOOK=y,CONFIG_KSU_DISABLE_SELINUX_VFS_GETXATTR=y,CONFIG_KSU_DEBUG=n,CONFIG_KSU_SUCOMPAT=n,CONFIG_OVERLAY_FS=y,CONFIG_KPROBES=y,CONFIG_HAVE_KPROBES=y,CONFIG_KPROBE_EVENTS=y,CONFIG_NOMOUNT=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst","neutron clang 24":"neutron-clang-24"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "0"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio curl zstd lz4 cmake zlib1g-dev zip
          pip install lxml

      - name: Configure Git Identity
        run: |
          git config --global --add safe.directory "*"
          git config --global user.email "joe_goldberg_542@protonmail.com"
          git config --global user.name "joe-goldberg-542"

      - name: Restore ccache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v5.1.0
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
          fail-on-cache-miss: false

      - name: Allocate 15GB Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 15G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=15360
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel Source
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi

      - name: Revert le9uo Commits
        run: |
          cd work/common
          LE9UO_COMMITS=$(git log --grep="le9uo" -i --format="%H")
          
          if [ -n "$LE9UO_COMMITS" ]; then
            for commit in $LE9UO_COMMITS; do
              if ! git revert --no-commit "$commit"; then
                for conf in arch/arm64/configs/gki_defconfig arch/arm64/configs/*defconfig; do
                  if [ -f "$conf" ]; then
                    git checkout HEAD -- "$conf" 2>/dev/null || true
                    git add "$conf" 2>/dev/null || true
                  fi
                done

                if git diff --name-only --diff-filter=U | grep -q .; then
                  git revert --abort
                fi
              fi
            done
            
            if ! git diff --cached --quiet; then
              git commit -m "chore: Revert le9uo commits"
            fi
          fi

      - name: Apply Custom Patches
        run: |
          cd work/common
          PATCH_DIRS=(
            "$GITHUB_WORKSPACE/.github/workflows/patches"
            "$GITHUB_WORKSPACE/patches"
          )

          shopt -s nullglob
          APPLIED_COUNT=0

          for dir in "${PATCH_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if git apply --check "$patch_file" 2>/dev/null; then
                  git apply "$patch_file"
                elif git apply --3way "$patch_file" 2>/dev/null; then
                  :
                elif patch -p1 --forward --fuzz=3 < "$patch_file"; then
                  :
                else
                  echo "::error::Failed to apply patch: $(basename "$patch_file")"
                  exit 1
                fi
                APPLIED_COUNT=$((APPLIED_COUNT + 1))
              done
            fi
          done

          if [ "$APPLIED_COUNT" -gt 0 ]; then
            git add -A
            git commit -m "chore: Apply $APPLIED_COUNT custom patch(es)" || true
          fi

      - name: Integrate NoMount
        run: |
          cd work/common
          rm -rf fs/nomount fs/nomount.c fs/nomount.h
          sed -i '/nomount/d' fs/Kconfig
          sed -i '/nomount/d' fs/Makefile

          sed -i '/nomount/d' fs/d_path.c 2>/dev/null || true
          sed -i '/nomount/d' fs/namei.c 2>/dev/null || true
          sed -i '/nomount/d' fs/stat.c 2>/dev/null || true
          sed -i '/nomount/d' fs/statfs.c 2>/dev/null || true
          sed -i '/nomount/d' fs/readdir.c 2>/dev/null || true
          sed -i '/nomount/d' fs/proc/task_mmu.c 2>/dev/null || true

          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git ../nomount

          sed -i '$i source "fs/nomount/Kconfig"' fs/Kconfig
          echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile

          mkdir -p fs/nomount
          if [ -d "../nomount/kernel/src" ]; then
            cp -rf ../nomount/kernel/src/* fs/nomount/
          elif [ -d "../nomount/src" ]; then
            cp -rf ../nomount/src/* fs/nomount/
          fi

      - name: Integrate SuSFS
        run: |
          cd work/common
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

      - name: Integrate BakaSU (Merge Selected Branches)
        run: |
          cd work/common
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
          
          cd KernelSU
          git config user.email "joe_goldberg_542@protonmail.com"
          git config user.name "joe-goldberg-542"
          
          git fetch origin --prune
          git checkout main
          
          BRANCHES=(
            "sync-susfs"
            "sync-upstream"
            "renovate/maven-group-in-manager"
            "renovate/gradle-9.x"
          )
          
          for branch in "${BRANCHES[@]}"; do
            echo "=========================================="
            echo "Merging origin/$branch into main..."
            ACTUAL_BRANCH=$(git branch -r | grep -i "origin/$branch$" | sed 's/origin\///' | tr -d ' ' | head -n 1)
            
            if [ -n "$ACTUAL_BRANCH" ]; then
              if git merge --no-edit "origin/$ACTUAL_BRANCH"; then
                echo "Successfully merged $ACTUAL_BRANCH"
              elif git merge --no-edit -X theirs "origin/$ACTUAL_BRANCH"; then
                echo "Merged $ACTUAL_BRANCH using auto-conflict resolution (-X theirs)"
              else
                echo "::warning::Conflict in $ACTUAL_BRANCH could not be auto-resolved, skipping..."
                git merge --abort || true
              fi
            else
              echo "::warning::Branch $branch not found on remote!"
            fi
          done
          
          cd ..
          
          cat << 'EOF' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SENTINEL=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_INLINE_HOOK=y
          CONFIG_KSU_SUSFS_SUS_MEMFD=y
          CONFIG_KSU_SUSFS_SUS_PROC_FD_LINK=y
          EOF

      - name: Inject KSU & SELinux Bridge Symbols
        run: |
          cd work/common

          cat << 'EOF' > drivers/kernelsu/compat_bridge.c
          #include <linux/types.h>
          #include <linux/fs.h>
          #include <linux/file.h>
          #include <linux/sched.h>
          #include <linux/uaccess.h>
          #include <linux/slab.h>

          bool ksu_setup_preinit_file(struct file *file)
          {
              return false;
          }

          void ksu_preinit_handle_post_execveat(int fd, struct filename *filename, void *argv, void *envp, int flags)
          {
          }

          int my_setprocattr(const char *name, void *value, size_t size)
          {
              return 1;
          }

          ssize_t my_write_context(struct file *file, const char __user *buf, size_t size, loff_t *ppos)
          {
              return 0;
          }

          ssize_t my_write_access(struct file *file, const char __user *buf, size_t size, loff_t *ppos)
          {
              return 0;
          }
          EOF

          if [ -f "drivers/kernelsu/Kbuild" ]; then
              echo "obj-y += compat_bridge.o" >> drivers/kernelsu/Kbuild
          elif [ -f "drivers/kernelsu/Makefile" ]; then
              echo "obj-y += compat_bridge.o" >> drivers/kernelsu/Makefile
          fi

      - name: Lock UTS_RELEASE Version
        run: |
          cd work/common
          K_VER=$(grep '^VERSION = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_PATCH=$(grep '^PATCHLEVEL = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_SUB=$(grep '^SUBLEVEL = ' Makefile | tr -d ' ' | cut -d= -f2)
          K_EXTRA=$(grep '^EXTRAVERSION = ' Makefile | tr -d ' ' | cut -d= -f2)
          
          LOCAL_VER="-android12-9"
          CURRENT_BUILD_VERSION="${K_VER}.${K_PATCH}.${K_SUB}${K_EXTRA}${LOCAL_VER}"
          
          sed -i "s/\.release.*=.*UTS_RELEASE,/.release\t= \"$CURRENT_BUILD_VERSION\",/g" init/version.c
          
          echo "#!/bin/sh" > scripts/setlocalversion
          chmod +x scripts/setlocalversion

      - name: Setup Neutron Clang
        if: ${{ inputs.clang_version == 'neutron clang 24' }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/neutron-clang
          cd $GITHUB_WORKSPACE/neutron-clang
          
          curl -sO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          
          ./antman -S
          ./antman --patch=glibc
          
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH
          echo "CC=ccache clang" >> $GITHUB_ENV
          echo "CXX=ccache clang++" >> $GITHUB_ENV
          echo "LTO=full" >> $GITHUB_ENV
          
      - name: Build Kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Repack and Sign Boot Image
        env:
          BOOT_IMG_URL: "https://www.dropbox.com/scl/fi/16oax1feqzx2z9spqkudy/Shinkaiboot.img?rlkey=3fuh9bgja0djrsmutg2rvqo6a&st=cw6rafsz&dl=1"
        shell: bash
        run: |
          mkdir -p repack/extracted
          mkdir -p repack/output
          
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg repack/mkbootimg_tool
          git clone --depth=1 https://android.googlesource.com/platform/external/avb repack/avb_tool

          curl -L "$BOOT_IMG_URL" -o repack/stock_boot.img

          PARTITION_SIZE=$(stat -c %s "repack/stock_boot.img")
          if [ "$PARTITION_SIZE" -lt 15000000 ]; then
             echo "::error::Corrupt boot image downloaded."
             exit 1
          fi

          export IMAGE_PATH="$GITHUB_WORKSPACE/work/dist/Image"
          if [ ! -f "$IMAGE_PATH" ]; then
             echo "::error::Compiled kernel Image does not exist."
             exit 1
          fi

          python3 repack/mkbootimg_tool/unpack_bootimg.py --boot_img repack/stock_boot.img --out repack/extracted > repack/extracted/configs.txt

          python3 - << 'EOF'
          import sys, os, subprocess

          config = {}
          with open("repack/extracted/configs.txt") as f:
              for line in f:
                  if ":" in line:
                      key, val = line.split(":", 1)
                      config[key.strip().lower().replace("_", " ")] = val.strip()

          header_version = config.get("boot image header version") or config.get("header version") or "4"
          page_size = config.get("page size") or "4096"
          cmdline = config.get("command line args") or config.get("command line") or config.get("cmdline") or ""
          board_name = config.get("name") or config.get("board name") or config.get("board") or ""
          os_version = config.get("os version") or ""
          os_patch_level = config.get("os patch level") or ""

          cmd = [
              "python3", "repack/mkbootimg_tool/mkbootimg.py",
              "--kernel", os.environ.get("IMAGE_PATH"),
              "--header_version", str(header_version),
              "--pagesize", str(page_size),
              "--output", "repack/output/boot.img"
          ]

          if cmdline: cmd.extend(["--cmdline", cmdline])
          if board_name: cmd.extend(["--board", board_name])
          if os_version and os_version != "None": cmd.extend(["--os_version", os_version])
          if os_patch_level and os_patch_level != "None": cmd.extend(["--os_patch_level", os_patch_level])

          if os.path.exists("repack/extracted/ramdisk"): cmd.extend(["--ramdisk", "repack/extracted/ramdisk"])
          if os.path.exists("repack/extracted/dtb"): cmd.extend(["--dtb", "repack/extracted/dtb"])
          if os.path.exists("repack/extracted/dtbo"): cmd.extend(["--dtbo", "repack/extracted/dtbo"])

          res = subprocess.run(cmd)
          if res.returncode != 0:
              print("::error::mkbootimg repack failed.")
              sys.exit(1)
          EOF

          if [ ! -f "repack/output/boot.img" ]; then
             echo "::error::Repacked boot image not found."
             exit 1
          fi

          python3 repack/avb_tool/avbtool.py add_hash_footer \
            --image "repack/output/boot.img" \
            --partition_name boot \
            --partition_size "$PARTITION_SIZE" \
            --key "repack/avb_tool/test/data/testkey_rsa2048.pem" \
            --algorithm SHA256_RSA2048

          cp repack/output/boot.img "$GITHUB_WORKSPACE/work/dist/boot.img"
          
      - name: Save ccache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v5.1.0
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-kernel-${{ github.run_number }}
          path: |
            work/dist/Image
            work/dist/Image.lz4
            work/dist/Image.gz
            work/dist/vmlinux
            work/dist/System.map
            work/dist/ikconfig
            work/dist/.config
            work/dist/boot.img
          retention-days: 7

      - name: Publish Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config boot.img; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Kernel GKI $tag" \
              --notes "Built with Merged BakaSU (5 branches) + SuSFS. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
